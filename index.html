<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesorios Sulli - Gestión de Clientes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Accesorios Sulli</h1>
            <p>Panel de Registro y Consulta de Clientes</p>
        </header>

        <div class="grid">
            <!-- Formulario de registro -->
            <div class="card">
                <h2>➕ Registrar Cliente</h2>
                <form id="formCliente">
                    <div class="form-group">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" required placeholder="Ej. Ana Morales">
                    </div>

                    <div class="form-group">
                        <label for="dependencia">Dependencia</label>
                        <input type="text" id="dependencia" required placeholder="Ej. Presidencia / DIF">
                    </div>

                    <div class="form-group">
                        <label for="celular">Celular</label>
                        <input type="tel" id="celular" required placeholder="Ej. 9991234567">
                    </div>

                    <div class="form-group">
                        <label for="deuda">Deuda Inicial ($)</label>
                        <input type="number" step="0.01" id="deuda" required placeholder="0.00" value="0.00">
                    </div>

                    <button type="submit" id="btnGuardar" class="btn-primary">Guardar en Base de Datos</button>
                </form>

                <div id="alerta" class="alert"></div>
            </div>

            <!-- Lista de clientes -->
            <div class="card">
                <h2>📋 Clientes Registrados</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Dependencia</th>
                                <th>Celular</th>
                                <th>Deuda</th>
                            </tr>
                        </thead>
                        <tbody id="listaClientes">
                            <tr>
                                <td colspan="4" class="empty-state">Cargando clientes...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('formCliente');
        const alerta = document.getElementById('alerta');
        const btnGuardar = document.getElementById('btnGuardar');
        const listaClientes = document.getElementById('listaClientes');

        // Detectar si se abre desde localhost:3000 o desde Live Server / archivo local
        const API_URL = (window.location.protocol === 'http:' || window.location.protocol === 'https:') && window.location.port === '3000'
            ? '/api'
            : 'http://localhost:3000/api';

        // Función para mostrar mensajes
        function mostrarMensaje(texto, tipo) {
            alerta.className = `alert ${tipo}`;
            alerta.textContent = texto;
            setTimeout(() => {
                alerta.className = 'alert';
                alerta.textContent = '';
            }, 5000);
        }

        // Cargar todos los clientes desde GET /api/clientes
        async function cargarClientes() {
            try {
                const res = await fetch(`${API_URL}/clientes`);
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error || `Error ${res.status}: ${res.statusText}`);
                }
                const clientes = await res.json();

                if (!Array.isArray(clientes) || clientes.length === 0) {
                    listaClientes.innerHTML = '<tr><td colspan="4" class="empty-state">No hay clientes registrados aún.</td></tr>';
                    return;
                }

                listaClientes.innerHTML = clientes.map(c => `
                    <tr>
                        <td><strong>${c.nombre || ''}</strong></td>
                        <td>${c.dependencia || ''}</td>
                        <td>${c.celular || 'Sin celular'}</td>
                        <td>
                            <span class="badge-deuda ${Number(c.deuda) === 0 ? 'badge-cero' : ''}">
                                $${Number(c.deuda || 0).toFixed(2)}
                            </span>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                listaClientes.innerHTML = `<tr><td colspan="4" class="empty-state" style="color: #dc2626;">
                    <strong>Error de conexión:</strong> ${err.message}<br>
                    <small style="color: #64748b;">Asegúrate de que el servidor Express esté corriendo en <code>http://localhost:3000</code></small>
                </td></tr>`;
                console.error('Error al cargar clientes:', err);
            }
        }

        // Manejar envío del formulario
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nuevoCliente = {
                nombre: document.getElementById('nombre').value.trim(),
                dependencia: document.getElementById('dependencia').value.trim(),
                celular: document.getElementById('celular').value.trim(),
                deuda: parseFloat(document.getElementById('deuda').value) || 0
            };

            btnGuardar.disabled = true;
            btnGuardar.textContent = 'Guardando...';

            try {
                const respuesta = await fetch(`${API_URL}/cliente`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoCliente)
                });

                const data = await respuesta.json();

                if (respuesta.ok) {
                    mostrarMensaje('¡Cliente guardado correctamente en la BD!', 'success');
                    form.reset();
                    document.getElementById('deuda').value = '0.00';
                    cargarClientes(); // Recargar la lista en vivo
                } else {
                    mostrarMensaje('Error de la BD: ' + (data.error || 'No se pudo registrar'), 'error');
                }
            } catch (error) {
                mostrarMensaje('Error al conectar con el servidor http://localhost:3000: ' + error.message, 'error');
                console.error(error);
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.textContent = 'Guardar en Base de Datos';
            }
        });

        // Cargar clientes al abrir la página
        cargarClientes();
    </script>
</body>
</html>
